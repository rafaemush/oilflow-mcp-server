name: Publish to the MCP registry

# Publishes ./server.json to registry.modelcontextprotocol.io.
# Authentication is GitHub's OIDC token for this repository, which the registry
# maps to the io.github.rafaemush/* namespace: no long-lived secret anywhere.
# Run it after every release sync (the version in server.json must be new; the
# registry rejects a version it already holds).

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher 1.8.1
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Login via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish

      - name: Verify the listing
        run: |
          sleep 15
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=oilflow" -o listing.json
          python3 -c "import json;d=json.load(open('listing.json'));print(json.dumps(d['metadata']));assert d['metadata']['count']>=1"
